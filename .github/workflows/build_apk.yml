name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          flutter config --no-analytics
          flutter pub get

      # GitHub 실행 번호(run_number)를 기반으로 버전명과 빌드 번호를 자동 증가시켜 빌드
      - name: Build Android APK
        run: flutter build apk --release --no-tree-shake-icons --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # main 브랜치 푸시 시 GitHub Releases에 최신 APK 자동 등록 (앱 내 자동 업데이트용)
      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: v1.0.${{ github.run_number }} (Build #${{ github.run_number }})
          body: |
            자동 빌드 릴리즈 (v1.0.${{ github.run_number }})
            변경 사항: ${{ github.event.head_commit.message }}
          files: build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
