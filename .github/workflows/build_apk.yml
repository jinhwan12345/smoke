name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 경고 해결: actions/setup-java 버전을 v4에서 v5로 업데이트
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      # 오류 해결: 수동으로 local.properties를 만드는 단계를 완전히 제거함

      - name: Install Dependencies
        run: |
          flutter config --no-analytics
          flutter pub get

      # 버전 정보를 빌드 명령어의 옵션으로 직접 전달
      - name: Build Android APK
        run: flutter build apk --release --no-tree-shake-icons --build-name=1.0 --build-number=1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
