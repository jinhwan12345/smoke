name: smoke_finder
description: "A Flutter application to find nearby smoking areas and check if current location is inside a smoking zone."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.4
  permission_handler: ^11.3.1
  http: ^1.2.1

dependency_overrides:
  geolocator_android: ^5.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
