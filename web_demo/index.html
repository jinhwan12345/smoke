<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>스모크 존 파인더</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="스모크파인더">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3055/3055815.png">
  
  <!-- Leaflet CDN -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Supabase SDK & Config -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase_config.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background-color: #0f172a;
      overflow: hidden;
      user-select: none;
    }
    header {
      background-color: #0f172a;
      color: white;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e293b;
      z-index: 1000;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn {
      background-color: #334155;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: transform 0.1s ease, background-color 0.2s;
    }
    .btn:hover { background-color: #475569; }
    .btn:active { transform: scale(0.95); }
    .btn-primary { background-color: #2563eb; }
    .btn-primary:hover { background-color: #1d4ed8; }

    #main-container {
      position: relative;
      flex: 1;
      width: 100%;
      height: 100%;
    }
    #map {
      width: 100%;
      height: 100%;
      z-index: 1;
      background: #0f172a;
    }

    /* 실시간 지오펜싱 상태 배너 */
    #status-banner {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      max-width: 500px;
      margin: 0 auto;
      background-color: #dc2626;
      color: white;
      padding: 12px 16px;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: background-color 0.25s ease, transform 0.2s ease;
      will-change: transform, background-color;
    }
    #status-banner.inside { background-color: #16a34a; }
    #status-banner.loading { background-color: #475569; }
    .status-icon { font-size: 26px; line-height: 1; }
    .status-info { flex: 1; min-width: 0; }
    .status-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .status-desc {
      font-size: 12px;
      opacity: 0.9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 리스트 뷰 오버레이 */
    #list-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #f8fafc;
      z-index: 999;
      display: none;
      flex-direction: column;
      padding: 80px 16px 20px 16px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .list-item {
      background: white;
      padding: 14px 16px;
      border-radius: 12px;
      margin-bottom: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
      border: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    .list-item:active { background-color: #f1f5f9; }

    /* 우측 하단 컨트롤 영역 */
    .leaflet-bottom.leaflet-right {
      right: 3px !important;
      bottom: 3px !important;
      margin: 0 !important;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .leaflet-control-zoom {
      margin: 0 !important;
      border: none !important;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2) !important;
      border-radius: 10px !important;
      overflow: hidden;
    }
    .leaflet-control-zoom a {
      width: 40px !important;
      height: 40px !important;
      line-height: 40px !important;
      font-size: 20px !important;
      color: #1e293b !important;
      background-color: white !important;
    }
    .fab-locate-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background-color: #2563eb;
      color: white;
      border: 2px solid white;
      box-shadow: 0 2px 8px rgba(37,99,235,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
      margin-bottom: 4px;
      transition: transform 0.15s;
    }
    .fab-locate-btn:active { transform: scale(0.9); }

    /* 좌측 하단 저작권 표기 */
    .leaflet-bottom.leaflet-left { left: 0 !important; bottom: 0 !important; margin: 0 !important; }
    .leaflet-control-attribution {
      margin: 0 !important;
      padding: 2px 6px !important;
      font-size: 10px !important;
      background: rgba(255,255,255,0.75) !important;
      border-top-right-radius: 4px;
    }

    /* 토스트 메시지 */
    #toast-msg {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background-color: rgba(15, 23, 42, 0.9);
      color: white;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      z-index: 2000;
      display: none;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span>🚬</span>
      <span>스모크 존 파인더</span>
    </div>
    <div class="header-actions">
      <button class="btn" id="btn-toggle-list" onclick="toggleListView()">📋 목록</button>
      <button class="btn btn-primary" onclick="locateAndMove()">🎯 내 위치</button>
    </div>
  </header>

  <div id="main-container">
    <div id="status-banner" class="loading">
      <div class="status-icon" id="banner-icon">🔄</div>
      <div class="status-info">
        <div class="status-title" id="banner-title">데이터 동기화 중...</div>
        <div class="status-desc" id="banner-desc">흡연구역 데이터를 불러오는 중입니다.</div>
      </div>
    </div>

    <div id="toast-msg"></div>
    <div id="map"></div>

    <div id="list-overlay">
      <h3 style="margin-bottom: 12px; color: #1e293b; font-size: 16px;">주변 흡연구역 목록 (거리순)</h3>
      <div id="area-list-container"></div>
    </div>
  </div>

  <script>
    // PWA 서비스 워커 등록
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }

    let smokingAreas = [];
    let mapLayers = [];
    let userLat = 35.90682384;
    let userLng = 128.62055516;

    // 1. 지도 초기화 (하드웨어 가속)
    const map = L.map('map', {
      zoomControl: false,
      attributionControl: false,
      preferCanvas: true
    }).setView([userLat, userLng], 17);

    L.control.attribution({ position: 'bottomleft' }).addTo(map);
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    // 내 위치 FAB 추가
    const locateControl = L.Control.extend({
      options: { position: 'bottomright' },
      onAdd: function() {
        const btn = L.DomUtil.create('button', 'fab-locate-btn');
        btn.innerHTML = '🎯';
        btn.title = '내 위치로 이동';
        btn.onclick = function(e) {
          e.stopPropagation();
          locateAndMove();
        };
        return btn;
      }
    });
    map.addControl(new locateControl());

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      subdomains: ['a', 'b', 'c'],
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // 사용자 위치 마커
    const userMarker = L.marker([userLat, userLng], {
      icon: L.divIcon({
        className: 'user-marker',
        html: '<div style="background-color:#2563eb; width:20px; height:20px; border-radius:50%; border:3px solid white; box-shadow:0 0 10px rgba(37,99,235,0.8);"></div>',
        iconSize: [20, 20],
        iconAnchor: [10, 10]
      })
    }).addTo(map);

    function showToast(text) {
      const toast = document.getElementById('toast-msg');
      toast.textContent = text;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 2000);
    }

    // 2. 캐시 로드
    function initDataWithCache() {
      const cached = localStorage.getItem('smoking_areas_cache');
      if (cached) {
        try {
          smokingAreas = JSON.parse(cached);
          renderMapMarkers();
          updateLocationState(userLat, userLng);
        } catch (e) {}
      }
      fetchSupabaseData();
    }

    // 3. Supabase 실시간 동기화
    async function fetchSupabaseData() {
      if (!SUPABASE_CONFIG || SUPABASE_CONFIG.url.includes('YOUR_PROJECT_REF')) {
        updateBannerUI(false, null, null, Infinity, 'Supabase 설정이 필요합니다.');
        return;
      }

      try {
        const client = supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey);
        const { data, error } = await client.from('smoking_areas').select('*');

        if (error) throw error;

        const parsed = (data || []).map(item => {
          let radius = 20.0;
          if (item.area_ar && parseFloat(item.area_ar) > 0) {
            radius = Math.max(8.0, Math.min(30.0, Math.sqrt(parseFloat(item.area_ar) / Math.PI) * 2));
          } else if (item.radius) {
            radius = parseFloat(item.radius);
          }

          return {
            id: item.id,
            name: item.area_nm || item.name || '지정 흡연구역',
            address: item.rdnmadr || item.lnmadr || item.address || '',
            latitude: parseFloat(item.latitude),
            longitude: parseFloat(item.longitude),
            radius: radius,
            type: item.area_se || item.type || '흡연구역',
            description: item.area_desc || item.description || (item.inst_nm ? `관리: ${item.inst_nm}` : '')
          };
        }).filter(a => !isNaN(a.latitude) && !isNaN(a.longitude));

        smokingAreas = parsed;
        localStorage.setItem('smoking_areas_cache', JSON.stringify(parsed));
        renderMapMarkers();
        updateLocationState(userLat, userLng);
      } catch (err) {
        console.warn('Supabase 동기화 오류:', err);
        if (smokingAreas.length === 0) {
          updateBannerUI(false, null, null, Infinity, '데이터를 불러올 수 없습니다.');
        }
      }
    }

    // 4. 지도 마커 렌더링 (일괄 갱신)
    function renderMapMarkers() {
      mapLayers.forEach(layer => map.removeLayer(layer));
      mapLayers = [];

      smokingAreas.forEach(area => {
        const circle = L.circle([area.latitude, area.longitude], {
          color: '#f59e0b',
          fillColor: '#fbbf24',
          fillOpacity: 0.22,
          radius: area.radius,
          weight: 2
        }).addTo(map);
        mapLayers.push(circle);

        const marker = L.marker([area.latitude, area.longitude], {
          icon: L.divIcon({
            className: 'smoke-marker',
            html: '<div style="background-color:#d97706; color:white; width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; border:2px solid white; box-shadow:0 2px 6px rgba(0,0,0,0.3); font-size:14px;">🚬</div>',
            iconSize: [30, 30],
            iconAnchor: [15, 15]
          })
        }).addTo(map).bindPopup(`
          <div style="font-family:sans-serif; line-height:1.4;">
            <b style="font-size:14px; color:#0f172a;">${area.name}</b><br>
            <span style="color:#64748b; font-size:12px;">${area.address}</span><br>
            <span style="display:inline-block; margin-top:4px; padding:2px 6px; background:#e2e8f0; border-radius:4px; font-size:11px; font-weight:600;">${area.type}</span>
            <span style="color:#0284c7; font-size:11px; margin-left:4px;">반경 ${Math.round(area.radius)}m</span>
          </div>
        `);
        mapLayers.push(marker);
      });
    }

    // 고속 Haversine 거리 계산
    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    // 5. 지오펜싱 상태 갱신
    function updateLocationState(lat, lng) {
      userLat = lat;
      userLng = lng;
      userMarker.setLatLng([lat, lng]);

      let insideArea = null;
      let nearestArea = null;
      let minDistance = Infinity;

      for (let i = 0; i < smokingAreas.length; i++) {
        const area = smokingAreas[i];
        const dist = calculateDistance(lat, lng, area.latitude, area.longitude);
        if (dist < minDistance) {
          minDistance = dist;
          nearestArea = area;
        }
        if (dist <= area.radius) {
          insideArea = area;
        }
      }

      updateBannerUI(insideArea !== null, insideArea, nearestArea, minDistance);
      renderList();
    }

    function updateBannerUI(isInside, insideArea, nearestArea, minDistance, customMsg) {
      const banner = document.getElementById('status-banner');
      const icon = document.getElementById('banner-icon');
      const title = document.getElementById('banner-title');
      const desc = document.getElementById('banner-desc');

      banner.classList.remove('loading');

      if (customMsg) {
        banner.className = 'loading';
        icon.textContent = '⚙️';
        title.textContent = '안내';
        desc.textContent = customMsg;
        return;
      }

      if (isInside && insideArea) {
        banner.className = 'inside';
        icon.textContent = '🚬';
        title.textContent = '현재 흡연구역 내부입니다';
        desc.textContent = `${insideArea.name} (반경 약 ${Math.round(insideArea.radius)}m)`;
      } else {
        banner.className = '';
        icon.textContent = '🚫';
        title.textContent = '현재 금연구역입니다';
        desc.textContent = nearestArea 
          ? `가장 가까운 흡연구역: ${Math.round(minDistance)}m (${nearestArea.name})`
          : '주변에 등록된 흡연구역이 없습니다.';
      }
    }

    function renderList() {
      const container = document.getElementById('area-list-container');
      container.innerHTML = '';

      if (smokingAreas.length === 0) {
        container.innerHTML = '<div style="color:#64748b; padding:20px; text-align:center;">등록된 흡연구역이 없습니다.</div>';
        return;
      }

      const listWithDist = smokingAreas.map(area => ({
        ...area,
        distance: calculateDistance(userLat, userLng, area.latitude, area.longitude)
      })).sort((a, b) => a.distance - b.distance);

      listWithDist.forEach(area => {
        const isInside = area.distance <= area.radius;
        const item = document.createElement('div');
        item.className = 'list-item';
        item.innerHTML = `
          <div>
            <div style="font-weight:700; font-size:14px; color:#0f172a;">${area.name}</div>
            <div style="color:#64748b; font-size:12px; margin: 2px 0;">${area.address}</div>
            <div style="color:${isInside ? '#16a34a' : '#2563eb'}; font-weight:600; font-size:12px;">
              ${Math.round(area.distance)}m 거리 • ${area.type}
            </div>
          </div>
          <button class="btn btn-primary" style="padding:5px 10px; font-size:12px;">이동</button>
        `;
        item.onclick = () => {
          toggleListView();
          map.setView([area.latitude, area.longitude], 18, { animate: true });
        };
        container.appendChild(item);
      });
    }

    function toggleListView() {
      const overlay = document.getElementById('list-overlay');
      const btn = document.getElementById('btn-toggle-list');
      const isOpen = overlay.style.display === 'flex';
      overlay.style.display = isOpen ? 'none' : 'flex';
      btn.textContent = isOpen ? '📋 목록' : '🗺️ 지도';
    }

    // 6. 실시간 위치 추적
    if (navigator.geolocation) {
      navigator.geolocation.watchPosition(
        pos => {
          userLat = pos.coords.latitude;
          userLng = pos.coords.longitude;
          updateLocationState(userLat, userLng);
        },
        () => {},
        { enableHighAccuracy: true, maximumAge: 10000, timeout: 6000 }
      );
    }

    function locateAndMove() {
      const overlay = document.getElementById('list-overlay');
      if (overlay.style.display === 'flex') toggleListView();

      map.setView([userLat, userLng], 17.5, { animate: true, duration: 0.5 });
      userMarker.setLatLng([userLat, userLng]);
      updateLocationState(userLat, userLng);
      showToast('🎯 내 위치로 이동했습니다');

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
          userLat = pos.coords.latitude;
          userLng = pos.coords.longitude;
          map.setView([userLat, userLng], 17.5, { animate: true, duration: 0.3 });
          updateLocationState(userLat, userLng);
        }, () => {}, { enableHighAccuracy: true, timeout: 3000 });
      }
    }

    // 초기 시작
    initDataWithCache();
  </script>
</body>
</html>
